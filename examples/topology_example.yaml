components:
  # QEMU Component — acts as the simulated computer
  - name: 'QEMU'
    source: 'resources/wasm/QEMU.wasm'
    config:
      'boot_mode': 'normal'
      'debug': 'false'
    ports:
      system:
        - port_name: 'i2c'
          type: 'json'
          lanes: 1
      environment:
        - port_name: 'env_temp'
          type: 'float'
          variables: 'temperature'
          interval_ms: 500
      scenario:
        - port_name: 'control_signal'
          type: 'bool'
          direction: in

  # Temperature Sensor Component — simple WASM peripheral
  - name: 'TEMP'
    source: 'resources/wasm/TEMP.wasm'
    config:
      'refresh_rate': '1000'
    ports:
      system:
        - port_name: 'i2c'
          type: 'json'
          lanes: 1
      scenario:
        - port_name: 'data_out'
          type: 'float'
          direction: out

# Wires — connect system ports between components
wires:
  - QEMU::i2c
  - TEMP::i2c
