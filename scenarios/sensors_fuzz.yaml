environment_variables:
  - name: temp
    type: float
  - name: accel
    type: vec3
  - name: omega
    type: vec3
  - name: B_field
    type: vec3


components:

  # -------------------
  # Virtual machine
  # -------------------

  - name: QEMU
    type: qemu
    config:
      arch: arm
      mem_mb: 1024
      options:
        - option: cpu
          value: cortex-a7
        - option: M
          value: virt
        - option: kernel
          value: ./image/zImage
        - option: append
          value: rootwait root=/dev/vda console=hvc0
        - option: drive
          value: if=none,file=./image/disk.qcow2,id=hd0
        - option: device
          value: virtio-blk-device,drive=hd0
        - option: nographic

        # Use virtual console to leave UART ports available
        - option: device
          value: virtio-serial
        - option: chardev
          value: pty,path=/tmp/qemu-serial-pty,id=char0
        - option: device
          value: virtconsole,chardev=char0
      i2c_timeout_ms: 10
    ports:
      system:
        - name: i2c
          type: i2c

  # -------------------
  # Per-sensor fuzzers
  #
  # Parallel architecture: each fuzzer has its own direct wire to QEMU.
  # When armed, the fuzzer synthesises an I2C NACK back toward QEMU so the
  # I2C master sees an immediate failure rather than waiting for a timeout
  # or receiving a spurious ACK from a different sensor on the bus.
  # -------------------

  - name: Fuzzer_Temp0
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 72   # 0x48 – PCT2075_0
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Temp1
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 73   # 0x49 – PCT2075_1
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Temp2
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 74   # 0x4A – PCT2075_2
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Temp3
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 75   # 0x4B – PCT2075_3
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Temp4
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 76   # 0x4C – PCT2075_4
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Temp5
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 77   # 0x4D – PCT2075_5
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Temp6
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 78   # 0x4E – PCT2075_6
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Temp7
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 79   # 0x4F – PCT2075_7
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_IMU
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 104  # 0x68 – IIM-42652
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  - name: Fuzzer_Mag
    type: fuzzer
    config:
      fuzzed_ports:
        - name: i2c_group
          syst_side: [i2c_syst]
          comp_side: [i2c_comp]
          sensor_address: 48   # 0x30 – MMC5983MA
    ports:
      system:
        - name: i2c_syst
          type: i2c
        - name: i2c_comp
          type: i2c

  # -------------------
  # Temperature sensors
  # -------------------

  - name: PCT2075_0
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x48"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_1
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x49"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_2
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4A"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_3
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4B"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_4
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4C"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_5
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4D"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_6
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4E"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_7
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4F"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  # -------------------
  # IMU & Magnetometer
  # -------------------

  - name: IIM-42652
    type: wasm
    config:
      module: component_artifacts/iim42652.wasm
      options:
        - ["i2cAddress", "0x68"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: acceleration
          variable: accel
          type: vec3
        - name: angular-velocity
          variable: omega
          type: vec3

  - name: MMC5983MA
    type: wasm
    config:
      module: component_artifacts/mmc5983ma.wasm
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: mag-field
          variable: B_field
          type: vec3


# -------------------
# Wires
#
# Parallel architecture: QEMU connects to every fuzzer's syst_side independently.
# Each fuzzer's comp_side connects directly to its paired sensor.
# No daisy-chaining — there is no shared bus segment where an un-armed sensor
# can intercept a transaction destined for an armed (fuzzed) sensor.
# -------------------

wires:
  # ── Temp0 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp0
      port: i2c_syst

  - - component: Fuzzer_Temp0
      port: i2c_comp
    - component: PCT2075_0
      port: i2c

  # ── Temp1 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp1
      port: i2c_syst

  - - component: Fuzzer_Temp1
      port: i2c_comp
    - component: PCT2075_1
      port: i2c

  # ── Temp2 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp2
      port: i2c_syst

  - - component: Fuzzer_Temp2
      port: i2c_comp
    - component: PCT2075_2
      port: i2c

  # ── Temp3 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp3
      port: i2c_syst

  - - component: Fuzzer_Temp3
      port: i2c_comp
    - component: PCT2075_3
      port: i2c

  # ── Temp4 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp4
      port: i2c_syst

  - - component: Fuzzer_Temp4
      port: i2c_comp
    - component: PCT2075_4
      port: i2c

  # ── Temp5 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp5
      port: i2c_syst

  - - component: Fuzzer_Temp5
      port: i2c_comp
    - component: PCT2075_5
      port: i2c

  # ── Temp6 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp6
      port: i2c_syst

  - - component: Fuzzer_Temp6
      port: i2c_comp
    - component: PCT2075_6
      port: i2c

  # ── Temp7 ──────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Temp7
      port: i2c_syst

  - - component: Fuzzer_Temp7
      port: i2c_comp
    - component: PCT2075_7
      port: i2c

  # ── IMU ────────────────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_IMU
      port: i2c_syst

  - - component: Fuzzer_IMU
      port: i2c_comp
    - component: IIM-42652
      port: i2c

  # ── Magnetometer ───────────────────────────────────────────────────────────
  - - component: QEMU
      port: i2c
    - component: Fuzzer_Mag
      port: i2c_syst

  - - component: Fuzzer_Mag
      port: i2c_comp
    - component: MMC5983MA
      port: i2c