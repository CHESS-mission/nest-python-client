[tool.poetry]
name = "nest-client"
version = "0.1.0"
description = "Python client for the CHESS NEST simulator"
authors = ["Emma Anastassova <emma.anastassova@epfl.ch>"]
readme = "README.md"
license = "MIT"
packages = [{include = "nest_client"}]

[tool.poetry.dependencies]
python = "^3.10"
websockets = "^12.0"
PyYAML = "^6.0"
anyio = "^4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
flake8 = "^7.0"
mypy = "^1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
