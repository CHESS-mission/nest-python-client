[tool.poetry]
name = "nest-client"
version = "0.1.0"
description = "Python client for the CHESS NEST simulator"
authors = [
  "Emma Anastassova <emma.anastassova@epfl.ch>"
  "Nathan Felber <nathan.felber@epfl.ch>"
]
readme = "README.md"
license = "MIT"
packages = [{include = "nest_client"}]

[tool.poetry.dependencies]
python = "^3.10"
websockets = "^12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
