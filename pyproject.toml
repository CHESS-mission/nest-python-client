[tool.poetry]
name = "nest-client"
version = "0.1.0"
description = "Python client for the CHESS NEST simulator"
authors = [
  "Emma Anastassova <emma.anastassova@epfl.ch>",
  "Nathan Felber <nathan.felber@epfl.ch>"
]
readme = "README.md"
license = "MIT"
packages = [{include = "nest_client"}]

[tool.poetry.dependencies]
python = "^3.10"
websockets = "^12.0"
numpy = "^2.4.2"
pyyaml = "^6.0.2"
rich = "^13.0"

[tool.poetry.scripts]
nest-client = "nest_client.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
